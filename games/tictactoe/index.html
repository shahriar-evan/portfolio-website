<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe AI — Evan</title>
<meta name="theme-color" content="#060608">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#060608;--tx:#eeebe6;--mu:#97919d;--dim:#5f5a66;--ac:#ef4444;--ac2:#a78bfa;--ok:#3ddc84;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.18);--card:rgba(17,15,21,.8);--ease:cubic-bezier(.2,.75,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(239,68,68,.12),transparent 70%),var(--bg);color:var(--tx);font:15px/1.5 "Archivo",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
header{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
header a{color:var(--mu);transition:color .3s}header a:hover{color:var(--tx)}
h1{font-stretch:112%;font-weight:850;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:-.03em;line-height:.95;text-transform:uppercase;text-align:center}
.sub{color:var(--mu);text-align:center;margin:10px 0 26px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--ln2);background:rgba(255,255,255,.03);color:var(--tx);font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.pill:hover,.pill.on{background:var(--tx);color:var(--bg)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px;margin-bottom:20px}
.score div{padding:12px;border:1px solid var(--ln);border-radius:14px;text-align:center;background:var(--card);color:var(--mu);transition:border-color .3s}
.score div.turn{border-color:var(--ln2);color:var(--tx)}
.score b{display:block;font-size:1.6rem;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
#st{min-height:1.6em;margin-bottom:16px;color:var(--mu)}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px}
.q{aspect-ratio:1;border-radius:18px;border:1px solid var(--ln);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:clamp(2.4rem,12vw,4rem);color:var(--tx);transition:border-color .3s,background .3s}
.q:hover:empty{border-color:var(--ln2);background:rgba(255,255,255,.05)}
.q i{animation:pop .35s var(--ease)}
.q .x{color:var(--tx)}.q .o{color:var(--ac2)}
.q.w{border-color:var(--ok);box-shadow:0 0 30px -8px rgba(61,220,132,.55)}.q.w i{color:var(--ok)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
:focus-visible{outline:1px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><a class="mono" href="../../#games">← Portfolio</a><span class="mono" style="color:var(--dim)">Game 03</span></header>
<h1>Tic-Tac-Toe</h1>
<p class="sub">Beat the AI — or play a friend on the same screen.</p>
<div class="bar" id="md"><button class="pill on" data-m="hard">vs AI · Hard</button><button class="pill" data-m="easy">vs AI · Easy</button><button class="pill" data-m="pvp">2 Players</button></div>
<div class="score mono"><div id="sx"><b id="cx">0</b><span id="lx">You (X)</span></div><div><b id="cd">0</b>Draws</div><div id="so"><b id="co">0</b><span id="lo">AI (O)</span></div></div>
<div id="st" class="mono" aria-live="polite"></div>
<div id="board"></div>
<div class="bar" style="margin-top:22px"><button class="pill" id="nx"><i class="fas fa-rotate-right"></i> New round</button><button class="pill" id="rs">Reset score</button></div>
<script>
var $=function(s){return document.querySelector(s)},B=$("#board"),mode="hard",bd,turn,over,sc={X:0,O:0,D:0},starter="X";
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function win(b){for(var i=0;i<8;i++){var l=LINES[i];if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]])return{p:b[l[0]],l:l}}return b.indexOf(null)<0?{p:"D"}:null}
function minimax(b,p,depth){var r=win(b);if(r)return r.p=="O"?10-depth:r.p=="X"?depth-10:0;
 var best=p=="O"?-99:99;for(var i=0;i<9;i++)if(!b[i]){b[i]=p;var s=minimax(b,p=="O"?"X":"O",depth+1);b[i]=null;best=p=="O"?Math.max(best,s):Math.min(best,s)}return best}
function aiMove(){var free=[];for(var i=0;i<9;i++)if(!bd[i])free.push(i);
 if(mode=="easy"&&Math.random()<.6)return free[Math.floor(Math.random()*free.length)];
 var bi=free[0],bs=-99;free.forEach(function(i){bd[i]="O";var s=minimax(bd,"X",1);bd[i]=null;if(s>bs){bs=s;bi=i}});return bi}
function label(){var ai=mode!="pvp";$("#lx").textContent=ai?"You (X)":"Player X";$("#lo").textContent=ai?"AI (O)":"Player O"}
function status(t){$("#st").textContent=t}
function render(){B.querySelectorAll(".q").forEach(function(q,i){q.innerHTML=bd[i]?'<i class="fas fa-'+(bd[i]=="X"?"xmark x":"circle o")+'"></i>':"";q.setAttribute("aria-label","Cell "+(i+1)+(bd[i]?", "+bd[i]:", empty"))});
 $("#sx").classList.toggle("turn",!over&&turn=="X");$("#so").classList.toggle("turn",!over&&turn=="O");
 $("#cx").textContent=sc.X;$("#co").textContent=sc.O;$("#cd").textContent=sc.D}
function play(i){if(over||bd[i])return;bd[i]=turn;var r=win(bd);
 if(r){over=true;sc[r.p]++;if(r.l)r.l.forEach(function(k){B.children[k].classList.add("w")});
  status(r.p=="D"?"It's a draw":mode=="pvp"?"Player "+r.p+" wins":r.p=="X"?"You win!":"AI wins");render();return}
 turn=turn=="X"?"O":"X";render();
 if(mode!="pvp"&&turn=="O"){status("AI is thinking…");setTimeout(function(){play(aiMove())},380)}else status(mode=="pvp"?"Player "+turn+"'s turn":"Your turn")}
function round(){bd=Array(9).fill(null);over=false;turn=starter;starter=starter=="X"?"O":"X";
 B.innerHTML=bd.map(function(_,i){return'<button class="q" data-i="'+i+'"></button>'}).join("");render();label();
 if(mode!="pvp"&&turn=="O"){status("AI starts…");setTimeout(function(){play(aiMove())},450)}else status(mode=="pvp"?"Player "+turn+"'s turn":"Your turn")}
B.onclick=function(e){var q=e.target.closest(".q");if(!q||(mode!="pvp"&&turn=="O"))return;play(+q.dataset.i)};
$("#md").onclick=function(e){var b=e.target.closest("[data-m]");if(!b)return;mode=b.dataset.m;document.querySelectorAll("[data-m]").forEach(function(x){x.classList.toggle("on",x==b)});sc={X:0,O:0,D:0};starter="X";round()};
$("#nx").onclick=round;$("#rs").onclick=function(){sc={X:0,O:0,D:0};starter="X";round()};
round();
</script>
</body>
</html>
